# RFC 8707 resource indicator sent on Agent 1's own ID-JAG request, naming
# Agent 2 as the intended recipient of that ID-JAG. Must match exactly the
# "Audience/resource URL" configured on Agent 2's Machine access tab in Okta
# (Directory > AI Agents > <Agent 2> > Machine access > Configure), or the
# delegation policy check rejects the second hop even with a caller link set up.
SECOND_AGENT_RESOURCE_URL=https://mcptestagent.com

# --- Third hop (hop B): Agent 2's own downstream resource, distinct from both
# Agent 1's resource and Agent 2's own auth server used above. Agent 2 takes
# the access_token it got from redeeming its hop-A ID-JAG (as Agent 1's
# delegate) and uses it as its own subject_token here.
THIRD_RESOURCE_AUTH_SERVER_ID=auszbru1m70vZai0b1d7
THIRD_RESOURCE_APP_TOKEN_ENDPOINT=https://cisokta.oktapreview.com/oauth2/auszbru1m70vZai0b1d7/v1/token
THIRD_XAA_SCOPE=api:access:read api:access:write